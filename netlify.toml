[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["content/**", "public/uploads/**"]

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Security headers for published static assets and SPA routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/logo.peg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# 1. API endpoints -> Netlify Express serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# 2. Newly uploaded images committed to GitHub before Netlify rebuild completes -> fallback through API function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/api/public/uploads/:splat"
  status = 200
  force = false

# 3. React Router SPA fallback (must remain last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
